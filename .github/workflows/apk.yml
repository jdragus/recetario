name: Construir APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la Biblia (solo la primera vez)
        run: |
          if [ -f biblia.json ]; then echo "La Biblia ya existe"; exit 0; fi
          curl -L --fail -o vpl.zip https://ebible.org/Scriptures/spaRV1909_vpl.zip
          mkdir -p vpl && unzip -o -q vpl.zip -d vpl
          cat > convertir.py <<'EOF'
          import re, glob, json
          CODES = ("GEN EXO LEV NUM DEU JOS JDG RUT 1SA 2SA 1KI 2KI 1CH 2CH EZR NEH EST JOB PSA PRO ECC SNG ISA JER LAM EZK DAN HOS JOL AMO OBA JON MIC NAM HAB ZEP HAG ZEC MAL "
                   "MAT MRK LUK JHN ACT ROM 1CO 2CO GAL EPH PHP COL 1TH 2TH 1TI 2TI TIT PHM HEB JAS 1PE 2PE 1JN 2JN 3JN JUD REV").split()
          rx = re.compile(r'^(\S{2,5}) (\d+):(\d+)\s+(.*)$')
          data, order = {}, []
          for f in sorted(glob.glob('vpl/**/*.txt', recursive=True)):
              for line in open(f, encoding='utf-8-sig', errors='replace'):
                  m = rx.match(line.strip())
                  if not m:
                      continue
                  b, c, v, t = m.group(1), int(m.group(2)), int(m.group(3)), m.group(4).replace('\u00b6', '').strip()
                  if c < 1 or v < 1 or not t:
                      continue
                  if b not in data:
                      data[b] = {}
                      order.append(b)
                  data[b].setdefault(c, {})[v] = t
          if all(b.upper() in CODES for b in order):
              ids = {b: b.upper() for b in order}
          elif len(order) == 66:
              ids = dict(zip(order, CODES))
          else:
              ids = {b: b.upper() for b in order if b.upper() in CODES}
          books = []
          for b in order:
              if b not in ids:
                  continue
              chs = data[b]
              arr = []
              for c in range(1, max(chs) + 1):
                  vs = chs.get(c, {})
                  arr.append([vs.get(v, '') for v in range(1, (max(vs) if vs else 0) + 1)])
              books.append({'id': ids[b], 'c': arr})
          print('Libros encontrados:', len(books))
          if len(books) < 60:
              raise SystemExit('No se pudo leer la Biblia del archivo descargado')
          json.dump({'v': 'RV1909', 'b': books}, open('biblia.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          EOF
          python3 convertir.py
          rm -rf vpl vpl.zip convertir.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add biblia.json
          git commit -m "Agregar Biblia Reina-Valera 1909"
          git push || echo "No se pudo guardar biblia.json en el repositorio"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear proyecto Android con la app adentro
        run: |
          P=android/app/src/main
          mkdir -p $P/java/io/github/jdragus/recetario $P/assets $P/res/mipmap-xxxhdpi $P/res/values
          cp index.html manifest.webmanifest icon-192.png icon-512.png $P/assets/
          if [ -f biblia.json ]; then cp biblia.json $P/assets/; fi
          cp icon-192.png $P/res/mipmap-xxxhdpi/ic_launcher.png

          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Recetario"
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'io.github.jdragus.recetario'
              compileSdk 34
              defaultConfig {
                  applicationId 'io.github.jdragus.recetario'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF

          cat > $P/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.hardware.camera.flash" android:required="false"/>
              <application android:label="Prepárate" android:icon="@mipmap/ic_launcher" android:theme="@style/AppTheme" android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#E0AB2A</item>
                  <item name="android:navigationBarColor">#E0AB2A</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

          cat > $P/java/io/github/jdragus/recetario/MainActivity.java <<'EOF'
          package io.github.jdragus.recetario;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private WebView web;
              private PermissionRequest pending;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest r) {
                          runOnUiThread(new Runnable() {
                              public void run() {
                                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                      r.grant(r.getResources());
                                  } else {
                                      pending = r;
                                      requestPermissions(new String[]{Manifest.permission.CAMERA}, 1);
                                  }
                              }
                          });
                      }
                  });
                  setContentView(web);
                  if (saved != null) web.restoreState(saved);
                  else web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  if (pending != null) {
                      if (results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED) pending.grant(pending.getResources());
                      else pending.deny();
                      pending = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Construir
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/ && gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: recetario-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
